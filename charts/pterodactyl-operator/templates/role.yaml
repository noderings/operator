{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pterodactyl-operator.fullname" . }}
rules:
  - apiGroups: ["gs.pterodactyl.com"]
    resources: ["pterodactylservers", "pterodactylservers/status", "pterodactylnodes", "pterodactylnodes/status", "pterodactylcontrols", "pterodactylcontrols/status", "pterodactylwebsocketrequests", "pterodactylwebsocketrequests/status", "pterodactylactions", "pterodactylactions/status", "pterodactylgamecatalogs", "pterodactylgamecatalogs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pterodactyl-operator.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pterodactyl-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pterodactyl-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
