{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pterodactylgamecatalogs.gs.pterodactyl.com
spec:
  group: gs.pterodactyl.com
  scope: Namespaced
  names:
    plural: pterodactylgamecatalogs
    singular: pterodactylgamecatalog
    kind: PterodactylGameCatalog
    shortNames:
      - pgc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [platformId]
              properties:
                platformId: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase: {type: string}
                message: {type: string}
                games:
                  type: array
                  items:
                    type: object
                    properties:
                      nestId: {type: integer}
                      nestName: {type: string}
                      eggId: {type: integer}
                      eggName: {type: string}
                      eula: {type: boolean}
                      variables:
                        type: array
                        items:
                          type: object
                          properties:
                            envVariable: {type: string}
                            name: {type: string}
                            description: {type: string}
                            defaultValue: {type: string}
                            rules: {type: string}
                            userViewable: {type: boolean}
                            userEditable: {type: boolean}
                            required: {type: boolean}
{{- end }}
