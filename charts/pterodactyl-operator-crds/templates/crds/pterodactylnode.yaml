{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pterodactylnodes.gs.pterodactyl.com
spec:
  group: gs.pterodactyl.com
  scope: Namespaced
  names:
    plural: pterodactylnodes
    singular: pterodactylnode
    kind: PterodactylNode
    listKind: PterodactylNodeList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - wingsNodeName
                - locationId
              properties:
                wingsNodeName: {type: string}
                locationId: {type: integer}
                maintenance: {type: boolean}
                schedulable: {type: boolean}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                panelNodeId: {type: integer}
                maintenance: {type: boolean}
{{- end }}
