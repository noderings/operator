{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pterodactylcontrols.gs.pterodactyl.com
spec:
  group: gs.pterodactyl.com
  scope: Namespaced
  names:
    plural: pterodactylcontrols
    singular: pterodactylcontrol
    kind: PterodactylControl
    listKind: PterodactylControlList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                panelUrl: {type: string}
                credentialsSecret: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                panelUrl: {type: string}
                nodeCount: {type: integer}
{{- end }}
