{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pterodactylservers.gs.pterodactyl.com
spec:
  group: gs.pterodactyl.com
  scope: Namespaced
  names:
    plural: pterodactylservers
    singular: pterodactylserver
    kind: PterodactylServer
    shortNames:
      - pts
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - pterodactylNodeRef
                - nestId
                - eggId
                - dockerImage
                - startup
                - environment
                - limits
                - featureLimits
                - externalId
                - panelUserId
                - name
                - nodeId
              properties:
                pterodactylNodeRef:
                  type: string
                nodeId:
                  type: integer
                nestId:
                  type: integer
                eggId:
                  type: integer
                eggName:
                  type: string
                dockerImage:
                  type: string
                startup:
                  type: string
                environment:
                  type: object
                  additionalProperties:
                    type: string
                requiredEnvironment:
                  type: array
                  items:
                    type: string
                limits:
                  type: object
                  required: [memory, swap, disk, io, cpu]
                  properties:
                    memory: {type: integer}
                    swap: {type: integer}
                    disk: {type: integer}
                    io: {type: integer}
                    cpu: {type: integer}
                    threads: {type: string}
                dedicated:
                  type: boolean
                oomDisabled:
                  type: boolean
                  default: true
                featureLimits:
                  type: object
                  required: [databases, backups, allocations]
                  properties:
                    databases: {type: integer}
                    backups: {type: integer}
                    allocations: {type: integer}
                externalId:
                  type: string
                panelUserId:
                  type: integer
                name:
                  type: string
                startOnCompletion:
                  type: boolean
                  default: true
                acceptEula:
                  type: boolean
                  default: false
                maintenance:
                  type: boolean
                hooks:
                  type: object
                  additionalProperties:
                    type: string
                operation:
                  type: object
                  properties:
                    type: {type: string}
                    requestedAt: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase: {type: string}
                message: {type: string}
                serverId: {type: integer}
                uuid: {type: string}
                identifier: {type: string}
                nodeId: {type: integer}
                observedRequestedAt: {type: string}
                eggChangeStep: {type: string}
                eggChangeRequest: {type: string}
                allocation:
                  type: object
                  properties:
                    id: {type: integer}
                    ip: {type: string}
                    port: {type: integer}
                    alias: {type: string}
{{- end }}
