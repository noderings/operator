{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pterodactylwebsocketrequests.gs.pterodactyl.com
spec:
  group: gs.pterodactyl.com
  scope: Namespaced
  names:
    plural: pterodactylwebsocketrequests
    singular: pterodactylwebsocketrequest
    kind: PterodactylWebsocketRequest
    listKind: PterodactylWebsocketRequestList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - identifier
              properties:
                identifier: {type: string}
                serverRef: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
{{- end }}
