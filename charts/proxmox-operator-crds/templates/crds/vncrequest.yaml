{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vncrequests.vm.proxmox.com
spec:
  group: vm.proxmox.com
  scope: Namespaced
  names:
    plural: vncrequests
    singular: vncrequest
    kind: VNCRequest
    shortNames:
      - vncr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - proxmoxVMRef
              properties:
                proxmoxVMRef:
                  type: object
                  description: "Reference to the ProxmoxVM CR that owns this VNCRequest"
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: "Name of the ProxmoxVM CR"
                    namespace:
                      type: string
                      description: "Namespace of the ProxmoxVM CR (defaults to same namespace as VNCRequest)"
                ttl:
                  type: integer
                  description: "Informational ticket-fetch window in seconds; backend owns create/delete (default: 30)"
                  default: 30
                  minimum: 10
                  maximum: 300
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  description: "Indicates if VNC credentials are available"
                caCert:
                  type: string
                  description: "CA certificate (PEM) for VNC TLS, from vnproxy/Proxmox API"
                vncport:
                  type: integer
                  description: "VNC proxy port number"
                ticket:
                  type: string
                  description: "VNC ticket from Proxmox/vnproxy API"
                password:
                  type: string
                  description: "RFB password from vncproxy (generate-password=1) for noVNC credentials"
                vmid:
                  type: string
                  description: "Proxmox VM ID"
                nodeName:
                  type: string
                  description: "Proxmox node name"
                proxmoxIp:
                  type: string
                  description: "Proxmox node IP for VNC connection"
                proxmoxPort:
                  type: integer
                  description: "Proxmox API port (e.g. 8006)"
                error:
                  type: string
                  description: "Error message if reconciliation failed"
      subresources:
        status: {}
{{- end }}
