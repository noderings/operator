{{- if and .Values.operator.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "virtfusion-operator.serviceAccountName" .) .Values.serviceAccount.name }}
  labels:
    {{- include "virtfusion-operator.operator.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
