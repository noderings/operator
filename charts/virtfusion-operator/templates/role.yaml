{{- if and .Values.operator.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "virtfusion-operator.fullname" . }}-role
  labels:
    {{- include "virtfusion-operator.operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vm.virtfusion.com"]
    resources: ["virtfusionvms", "virtfusionvms/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vm.virtfusion.com"]
    resources: ["virtfusioncontrols", "virtfusioncontrols/status", "virtfusionnodes", "virtfusionnodes/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["vm.virtfusion.com"]
    resources: ["virtfusionvncrequests", "virtfusionvncrequests/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
{{- end }}
