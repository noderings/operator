{{- if and .Values.alloy.enabled .Values.alloy.mimir.bearerToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.alloy.mimir.secretName | default (printf "%s-mimir-credentials" (include "virtfusion-operator.fullname" .)) }}
  labels:
    {{- include "virtfusion-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-forwarder
type: Opaque
stringData:
  MIMIR_BEARER_TOKEN: {{ .Values.alloy.mimir.bearerToken | quote }}
{{- end }}
