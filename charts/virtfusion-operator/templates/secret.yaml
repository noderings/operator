{{- if .Values.operator.enabled }}
{{- range .Values.virtfusion.instances }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "virtfusion-operator.credentialsSecretName" (dict "root" $ "instance" .) }}
  labels:
    {{- include "virtfusion-operator.operator.labels" $ | nindent 4 }}
    virtfusion.operator/instance-id: {{ .id | quote }}
type: Opaque
stringData:
  VIRTFUSION_URL: {{ .url | quote }}
  VIRTFUSION_TOKEN: {{ .token | default "" | quote }}
  VIRTFUSION_USER_API_TOKEN: {{ .userApiToken | default "" | quote }}
  VIRTFUSION_USER_ID: {{ .userId | default "" | quote }}
  VIRTFUSION_USER_NAME: {{ .userName | default "" | quote }}
{{- end }}
{{- end }}
{{- end }}
