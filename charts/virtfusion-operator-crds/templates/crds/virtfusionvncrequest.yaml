{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtfusionvncrequests.vm.virtfusion.com
spec:
  group: vm.virtfusion.com
  scope: Namespaced
  names:
    plural: virtfusionvncrequests
    singular: virtfusionvncrequest
    kind: VirtFusionVNCRequest
    shortNames:
      - vfvnc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - vmRef
              properties:
                vmRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: "Name of the VirtFusionVM CR"
                ttl:
                  type: integer
                  description: "Ticket-fetch window in seconds (default 30)"
                  default: 30
                  minimum: 10
                  maximum: 300
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  description: "Whether VNC credentials are available"
                hypervisorIp:
                  type: string
                  description: "Hypervisor management IP for VNC TCP connection"
                port:
                  type: integer
                  description: "RFB TCP port (e.g. 5903)"
                password:
                  type: string
                  description: "RFB password for noVNC credentials"
                error:
                  type: string
                  description: "Error message if reconciliation failed"
      subresources:
        status: {}
{{- end }}
