# Production / default Helm values.
# Replace the example Proxmox URL and API token before installing.

# Install vm.proxmox.com CRDs via proxmox-operator-crds subchart.
crds:
  enabled: true

proxmox-operator-crds:
  enabled: true

image:
  registry: harbor.noderings.com
  repository: nrings/proxmox-operator
  # Harbor stores this OCI Helm chart and the container image in the same repo.
  # Helm OCI tag is Chart.yaml version (0.1.9). Image tag keeps the v prefix so it
  # does not overwrite the chart. Live clusters keep their current tag until they opt in.
  tag: v0.1.10
  pullPolicy: IfNotPresent
  pullSecrets: []

revisionHistoryLimit: 10

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  # Token is mounted explicitly via projected volume on the operator pod.
  automountServiceAccountToken: false

rbac:
  create: true

# Pod-level security defaults (Kubescape / NSA hardening)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true

# Lifecycle hook Jobs for provider Python scripts (spec.hooks).
# Requires a CNI that enforces NetworkPolicy. Do not enable on clusters that ignore NP.
hooks:
  enabled: true
  # Empty → {Release.Namespace}-hooks. Jobs and script Secrets land there, not
  # beside VM CRs / hypervisor credential Secrets.
  jobNamespace: ""
  # Provider-owned Secret in the hooks namespace. Keys become env vars and files
  # under /var/run/secrets/noderings-hooks. Missing Secret does not fail Jobs
  # (optional: true). Set to "" to disable injection.
  providerSecretName: "noderings-hook-secrets"
  # Empty uses the operator image (stdlib Python). Override to pin a slimmer image.
  image: ""
  timeoutSeconds: 300
  maxConcurrent: 5
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  extraEgress: []
  # - cidr: 203.0.113.10/32
  #   port: 8443
  # Provider LAN / Tailscale. except CIDRs must be subsets of cidr (NetworkPolicy).
  # Cluster, docker/kind, metadata, and loopback stay blocked via except + public deny-list.
  privateEgress:
    - cidr: 10.0.0.0/8
      except:
        - 10.42.0.0/16   # k3s pods
        - 10.43.0.0/16   # k3s services
        - 10.96.0.0/12   # kubeadm services
        - 10.100.0.0/16  # platform control-plane pods
        - 10.101.0.0/16  # platform control-plane services
        - 10.200.0.0/16  # NodeRings provider pods
        - 10.201.0.0/16  # NodeRings provider services
        - 10.244.0.0/16  # flannel pods
    - cidr: 172.16.0.0/12
      except:
        - 172.17.0.0/16  # docker0
        - 172.18.0.0/16  # docker/kind
    - cidr: 192.168.0.0/16
    - cidr: 100.64.0.0/10  # CGNAT / Tailscale
    - cidr: fc00::/7       # IPv6 ULA

proxmox:
  # Agent installs never verify the Proxmox API TLS certificate.
  verifySSL: false
  timeoutSeconds: 30

  # Multiple Proxmox instances configuration
  # Each instance has its own credentials and URL.
  # Prefer existingSecret (NR CLI / ExternalSecrets) so tokenSecret never enters Helm values.
  instances:
    # Replace with your Proxmox API URL and API token (Helm / install-proxmox-operator.sh overrides this in real deploys).
    - id: "proxmox-1"
      url: "https://192.168.1.100:8006"
      username: "kopfoperator@pve"
      tokenId: "kopf-operator-token"
      tokenSecret: "your-token-secret-here"
      # existingSecret: "operator-proxmox-operator-proxmox-credentials-proxmox-1"

    # Example second instance (optional):
    # - id: "proxmox-2"
    #   url: "https://192.168.1.101:8006"
    #   username: "kopfoperator@pve"
    #   tokenId: "kopf-operator-token-2"
    #   tokenSecret: "your-token-secret-here"
    #   existingSecret: ""

env: []

# VMBackup reconciliation: delay after Proxmox vzdump POST (seconds) before returning UPID to status.
# Maps to BACKUP_VZDUMP_POST_DELAY_SECONDS on the operator pod.
backup:
  vzdumpPostDelaySeconds: 5

securityContext:
  # Increase file descriptor limit to prevent "too many open files" errors
  nofile: 65536

# Operator-specific overrides (inherits podSecurityContext/containerSecurityContext)
operator:
  enabled: true
  automountServiceAccountToken: false
  mountServiceAccountToken: true
  podSecurityContext: {}
  containerSecurityContext: {}

nodeSelector: {}
affinity: {}
tolerations: []

prometheusExporter:
  enabled: true
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    capabilities:
      drop:
        - ALL
  image:
    repository: harbor.noderings.com/nrings/prometheus-pve-exporter
    tag: dev
    pullPolicy: IfNotPresent

  # Resource limits and requests
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Service configuration
  service:
    type: ClusterIP
    port: 9221
    annotations: {}

  # Collector configuration
  collectors:
    status: true
    version: true
    node: true
    cluster: true
    resources: true
    # Per-guest config scrape (one API call per VM/CT on the target). Needed for
    # pve_node_cpu_pinned / pve_node_guests_unpinned so dedicated nodes can see
    # which logical CPUs foreign guests already occupy — not full foreign VM details
    # (those series are still dropped by Alloy before Mimir).
    config: true
    replication: true
    subscription: true

  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  # Additional pod configuration
  nodeSelector: {}
  affinity: {}
  tolerations: []

vncGateway:
  enabled: true
  namespace: "vnc-gateway"
  replicas: 1
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL
  image:
    repository: harbor.noderings.com/nrings/vnc-gateway
    # Stock Harbor :main. Do not retag a local-rfb build over this — Proxmox
    # readiness and /v1/vnc/ws need the published digest.
    tag: main
    pullPolicy: IfNotPresent
    pullSecrets: []  # Falls back to chart image.pullSecrets if empty
  port: 8080
  logLevel: info
  readTimeout: 30s
  writeTimeout: 10s
  # TLS to Proxmox (recommended: verify certificates).
  # Prefer PROXMOX_URL hosts that appear on the PVE certificate SAN.
  # If the dial address is not on the SAN, set proxmoxTLSServerName (global
  # default) or per-instance VNC_PROXMOX_<ID>_TLS_SERVER_NAME.
  # For private/self-signed CAs, set proxmoxCAPem (readiness) and/or supply a
  # CA on the VNC WebSocket request (caCert / X-Ca-Cert). Public CAs need neither.
  # Set proxmoxInsecureSkipVerify only as a temporary opt-out.
  proxmoxInsecureSkipVerify: false
  # Global default when an instance omits its own ServerName:
  # proxmoxTLSServerName: "pve.example.com"
  proxmoxTLSServerName: ""
  # PEM of a private/PVE CA (or leaf as trust anchor). Required for readiness
  # when verification is enabled and the issuer is not in the trust store.
  proxmoxCAPem: ""

  # NetworkPolicy extras (global networkPolicy.enabled must also be true).
  networkPolicy:
    # Allow ingress whose source is not a local pod (e.g. multi-cluster service
    # reflection / remapped Endpoints). Keep false in single-cluster installs.
    allowRemoteClients: false
    # Optional extra ingress rules (merged as-is under spec.ingress).
    extraIngress: []

  podAnnotations: {}

  # Prometheus pod annotations (optional legacy scrape); use serviceMonitor when Prometheus Operator is available
  metrics:
    scrape:
      enabled: false
      path: /metrics
      port: "8080"

  telemetry:
    tracingEnabled: false
    otlpEndpoint: ""
    otlpInsecure: false
    traceSampleRatio: 1
    serviceName: ""
    serviceVersion: ""

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # ServiceMonitor for Prometheus Operator (scrapes vnc-gateway /metrics)
  serviceMonitor:
    enabled: false
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

  nodeSelector: {}
  affinity: {}
  tolerations: []

alloy:
  enabled: true

  global:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

  serviceAccount:
    automountServiceAccountToken: false

  rbac:
    create: false

  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress
    ingress:
      - from:
          - podSelector: {}
        ports:
          - port: 12345
            protocol: TCP
    egress:
      - ports:
          - port: 9221
            protocol: TCP
      # Lab metrics endpoints. Production remote write uses 443.
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8082
            protocol: TCP
      - ports:
          - port: 443
            protocol: TCP
      - ports:
          - port: 80
            protocol: TCP
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP

  controller:
    volumes:
      extra:
        - name: tmp
          emptyDir: {}

  configReloader:
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 50m
        memory: 64Mi

  # alloy deamonset configuration
  alloy:
    # For environments without auth (e.g., local development), leave envFrom empty or omit it
    envFrom: []
    # envFrom:
    #   - secretRef:
    #       name: mimir-credentials
    configMap:
      create: false
      name: operator-proxmox-operator-alloy-config

    image:
      repository: grafana/alloy
      tag: v1.12.1
      pullPolicy: IfNotPresent

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    mounts:
      extra:
        - name: tmp
          mountPath: /tmp

    # Resource limits and requests
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi


  # Agent UUID stamped on all remote_written series as label agent_id.
  # Set by the CLI during `nr cluster register` (do not invent a second ID).
  agentId: ""

  # Production remote_write host. Point a lab install elsewhere with Helm --set only, e.g.
  #   --set-string alloy.mimir.serviceEndpoint=$MIMIR_SERVICE_ENDPOINT
  #   --set alloy.mimir.tls.enabled=$MIMIR_TLS_ENABLED
  # Do not bake a lab address into the chart, CRD, or image.
  mimir:
    serviceEndpoint: "metrics.noderings.com"
    # TLS/HTTPS configuration for Mimir endpoint
    tls:
      enabled: true
    # Secret name containing MIMIR_BEARER_TOKEN (created by CLI; do not pass token via Helm --set)
    secretName: "mimir-credentials"
    # Optional chart-managed token (prefer external Secret via secretName)
    bearerToken: ""

  # Scrape configuration
  scrape:
    interval: 30s
    timeout: 10s
