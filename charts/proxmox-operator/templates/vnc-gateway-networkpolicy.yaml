{{- if and .Values.vncGateway.enabled .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "proxmox-operator.fullname" . }}-vnc-gateway
  namespace: {{ .Values.vncGateway.namespace }}
  labels:
    {{- include "proxmox-operator.vncGateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "proxmox-operator.vncGateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traffic from pods in any local namespace.
    - from:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.vncGateway.port }}
          protocol: TCP
    {{- if .Values.vncGateway.networkPolicy.allowRemoteClients }}
    # Remapped / multi-cluster clients often arrive with source IPs that are not
    # tied to a local pod, so namespaceSelector alone drops them. A port-only
    # rule allows those clients to reach the gateway.
    - ports:
        - port: {{ .Values.vncGateway.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.vncGateway.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - ports:
        - port: 8006
          protocol: TCP
        - port: 443
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
