{{- if .Values.operator.enabled }}
{{- range .Values.proxmox.instances }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxmox-operator.credentialsSecretName" (dict "root" $ "instance" .) }}
  labels:
    {{- include "proxmox-operator.operator.labels" $ | nindent 4 }}
    proxmox.operator/instance-id: {{ .id | quote }}
type: Opaque
stringData:
  PROXMOX_URL: {{ .url | quote }}
  PROXMOX_USERNAME: {{ .username | quote }}
  PROXMOX_TOKEN_ID: {{ .tokenId | quote }}
  PROXMOX_TOKEN_SECRET: {{ .tokenSecret | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- $vnc := .Values.vncGateway | default dict }}
{{- if and .Values.vncGateway.enabled $vnc.namespace }}
{{- range .Values.proxmox.instances }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxmox-operator.credentialsSecretName" (dict "root" $ "instance" .) }}
  namespace: {{ $vnc.namespace }}
  labels:
    {{- include "proxmox-operator.operator.labels" $ | nindent 4 }}
    proxmox.operator/instance-id: {{ .id | quote }}
type: Opaque
stringData:
  PROXMOX_URL: {{ .url | quote }}
  PROXMOX_USERNAME: {{ .username | quote }}
  PROXMOX_TOKEN_ID: {{ .tokenId | quote }}
  PROXMOX_TOKEN_SECRET: {{ .tokenSecret | quote }}
{{- end }}
{{- end }}
{{- end }}
