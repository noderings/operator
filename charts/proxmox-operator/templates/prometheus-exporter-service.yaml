{{- if .Values.prometheusExporter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proxmox-operator.fullname" . }}-exporter
  labels:
    {{- include "proxmox-operator.prometheusExporter.labels" . | nindent 4 }}
  {{- with .Values.prometheusExporter.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.prometheusExporter.service.type }}
  selector:
    {{- include "proxmox-operator.prometheusExporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.prometheusExporter.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
