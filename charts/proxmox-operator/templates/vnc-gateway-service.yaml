{{- if .Values.vncGateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: vnc-gateway
  namespace: {{ .Values.vncGateway.namespace }}
  labels:
    {{- include "proxmox-operator.vncGateway.labels" . | nindent 4 }}
  {{- with .Values.vncGateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.vncGateway.service.type }}
  selector:
    {{- include "proxmox-operator.vncGateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.vncGateway.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
