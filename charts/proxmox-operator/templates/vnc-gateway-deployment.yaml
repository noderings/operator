{{- if .Values.vncGateway.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxmox-operator.fullname" . }}-vnc-gateway
  namespace: {{ .Values.vncGateway.namespace }}
  labels:
    {{- include "proxmox-operator.vncGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vncGateway.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 10 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "proxmox-operator.vncGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "proxmox-operator.vncGateway.labels" . | nindent 8 }}
      {{- if or .Values.vncGateway.metrics.scrape.enabled .Values.vncGateway.podAnnotations }}
      annotations:
        {{- if .Values.vncGateway.metrics.scrape.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.vncGateway.metrics.scrape.path | quote }}
        prometheus.io/port: {{ .Values.vncGateway.metrics.scrape.port | quote }}
        {{- end }}
        {{- with .Values.vncGateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.vncGateway.automountServiceAccountToken }}
      {{- if .Values.vncGateway.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.vncGateway.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- else if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "proxmox-operator.podSecurityContext" (dict "context" . "overrides" .Values.vncGateway.podSecurityContext) | nindent 8 }}
      containers:
        - name: vnc-gateway
          image: "{{ .Values.vncGateway.image.repository }}:{{ .Values.vncGateway.image.tag }}"
          imagePullPolicy: {{ .Values.vncGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.vncGateway.port }}
              protocol: TCP
          securityContext:
            {{- include "proxmox-operator.containerSecurityContext" (dict "context" . "overrides" .Values.vncGateway.containerSecurityContext) | nindent 12 }}
          env:
            - name: VNC_SERVER_PORT
              value: {{ .Values.vncGateway.port | quote }}
            - name: VNC_LOG_LEVEL
              value: {{ .Values.vncGateway.logLevel | quote }}
            - name: VNC_SERVER_READ_TIMEOUT
              value: {{ .Values.vncGateway.readTimeout | quote }}
            - name: VNC_SERVER_WRITE_TIMEOUT
              value: {{ .Values.vncGateway.writeTimeout | quote }}
            - name: VNC_PROXMOX_INSECURE_SKIP_VERIFY
              value: {{ .Values.vncGateway.proxmoxInsecureSkipVerify | default false | quote }}
            {{- with .Values.vncGateway.proxmoxTLSServerName }}
            - name: VNC_PROXMOX_TLS_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.vncGateway.proxmoxCAPem }}
            - name: VNC_PROXMOX_CA_PEM
              value: {{ . | quote }}
            {{- end }}
            {{- if and .Values.vncGateway.telemetry.tracingEnabled .Values.vncGateway.telemetry.otlpEndpoint }}
            - name: VNC_TELEMETRY_TRACING_ENABLED
              value: "true"
            - name: VNC_TELEMETRY_OTLP_ENDPOINT
              value: {{ .Values.vncGateway.telemetry.otlpEndpoint | quote }}
            - name: VNC_TELEMETRY_OTLP_INSECURE
              value: {{ .Values.vncGateway.telemetry.otlpInsecure | default false | quote }}
            - name: VNC_TELEMETRY_TRACE_SAMPLE_RATIO
              value: {{ .Values.vncGateway.telemetry.traceSampleRatio | default 1 | quote }}
            {{- with .Values.vncGateway.telemetry.serviceName }}
            - name: VNC_TELEMETRY_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.vncGateway.telemetry.serviceVersion }}
            - name: VNC_TELEMETRY_SERVICE_VERSION
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- range .Values.proxmox.instances }}
            {{- $credSecret := include "proxmox-operator.credentialsSecretName" (dict "root" $ "instance" .) }}
            - name: VNC_PROXMOX_{{ .id | upper | replace "-" "_" }}_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $credSecret }}
                  key: PROXMOX_URL
            - name: VNC_PROXMOX_{{ .id | upper | replace "-" "_" }}_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $credSecret }}
                  key: PROXMOX_USERNAME
            - name: VNC_PROXMOX_{{ .id | upper | replace "-" "_" }}_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $credSecret }}
                  key: PROXMOX_TOKEN_ID
            - name: VNC_PROXMOX_{{ .id | upper | replace "-" "_" }}_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $credSecret }}
                  key: PROXMOX_TOKEN_SECRET
            {{- end }}
          resources:
{{ toYaml .Values.vncGateway.resources | indent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector:
{{ toYaml .Values.vncGateway.nodeSelector | indent 8 }}
      affinity:
{{ toYaml .Values.vncGateway.affinity | indent 8 }}
      tolerations:
{{ toYaml .Values.vncGateway.tolerations | indent 8 }}
{{- end }}
