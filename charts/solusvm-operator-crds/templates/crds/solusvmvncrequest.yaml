{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: solusvmvncrequests.vm.solusvm.com
spec:
  group: vm.solusvm.com
  scope: Namespaced
  names:
    plural: solusvmvncrequests
    singular: solusvmvncrequest
    kind: SolusVMVNCRequest
    shortNames:
      - svmvnc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - vmRef
              properties:
                vmRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: "Name of the SolusVMVM CR"
                ttl:
                  type: integer
                  description: "Ticket-fetch window in seconds (default 30)"
                  default: 30
                  minimum: 10
                  maximum: 300
            status:
              type: object
              properties:
                ready:
                  type: boolean
                  description: "Whether VNC credentials are available"
                wsUrl:
                  type: string
                  description: "noVNC websocket URL (wss://{mn}/vnc?url=…)"
                password:
                  type: string
                  description: "VNC password from server settings.vnc_password"
                error:
                  type: string
                  description: "Error message if reconciliation failed"
      subresources:
        status: {}
{{- end }}
