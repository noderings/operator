{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: solusvmvms.vm.solusvm.com
spec:
  group: vm.solusvm.com
  scope: Namespaced
  names:
    plural: solusvmvms
    singular: solusvmvm
    kind: SolusVMVM
    shortNames:
      - svmvm
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - solusvmNodeRef
                - planId
                - osImageVersionId
                - locationId
                - computeResourceId
                - userEmail
              properties:
                solusvmNodeRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: "Name of the SolusVMNode CR"
                planId:
                  type: integer
                  description: "SolusVM plan id"
                osImageVersionId:
                  type: integer
                  description: "SolusVM OS image version id (KVM)"
                locationId:
                  type: integer
                computeResourceId:
                  type: integer
                userEmail:
                  type: string
                  description: "SolusVM user email (org mailbox, not a real inbox)"
                hostname:
                  type: string
                  description: "FQDN hostname for the VM"
                name:
                  type: string
                  description: "Display name (NR-{uuid})"
                cpuCores:
                  type: integer
                memoryMb:
                  type: integer
                diskGb:
                  type: integer
                primaryIP:
                  type: string
                  description: "Optional exact primary IPv4; omit on create so SolusVM assigns from its IP block"
                additionalIPv4:
                  type: array
                  items:
                    type: string
                  description: "Extra IPv4 addresses from NodeRings IPAM"
                ipv6:
                  type: boolean
                  description: "When true, request an extra IPv6 from SolusVM (additional_ipv6_count=1)"
                sshPublicKeys:
                  type: array
                  items:
                    type: string
                  description: "SSH public key material (OpenSSH)"
                userData:
                  type: string
                  description: "Optional cloud-config; never logged"
                operation:
                  type: object
                  properties:
                    type:
                      type: string
                    requestedAt:
                      type: string
                      description: "Unique per apply so Restart/start/stop re-run while type is unchanged (identical spec does not bump generation)."
                hooks:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 65536
                  description: "Provider lifecycle hook scripts keyed by operation (created, started, stopped, deleted, restarted, reinstalled)."
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Ready", "Error"]
                message:
                  type: string
                observedGeneration:
                  type: integer
                  description: "Spec generation last handled. Restart/start/stop run once per generation (Liqo re-fires kopf on.create)."
                observedRequestedAt:
                  type: string
                  description: "spec.operation.requestedAt last handled. Repeat Restart sends a new requestedAt without changing type."
                serverId:
                  type: integer
                  description: "SolusVM server id"
                uuid:
                  type: string
                  description: "SolusVM server UUID"
                taskId:
                  type: integer
                computeResourceId:
                  type: integer
                projectId:
                  type: integer
                userId:
                  type: integer
                macAddress:
                  type: string
                ipv4:
                  type: array
                  items:
                    type: string
                ipv6:
                  type: string
                  description: "SolusVM-assigned primary IPv6 from GET /servers/{id}"
                ipv4Gateway:
                  type: string
                  description: "IPv4 gateway assigned by SolusVM"
                ipv4Prefix:
                  type: string
                  description: "Primary IPv4 CIDR prefix length assigned by SolusVM"
                ipv6Gateway:
                  type: string
                  description: "IPv6 gateway assigned by SolusVM"
                ipv6Prefix:
                  type: string
                  description: "Primary IPv6 CIDR prefix length assigned by SolusVM"
                dnsServers:
                  type: array
                  items:
                    type: string
                  description: "DNS servers from the SolusVM IP block"
                lastHook:
                  type: object
                  description: "Result of the most recent lifecycle hook Job."
                  properties:
                    operation:
                      type: string
                    state:
                      type: string
                    ranAt:
                      type: string
                    message:
                      type: string
                    jobName:
                      type: string
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: ServerId
          type: integer
          jsonPath: .status.serverId
        - name: Node
          type: string
          jsonPath: .spec.solusvmNodeRef.name
        - name: IPv4
          type: string
          jsonPath: .status.ipv4[0]
      subresources:
        status: {}
{{- end }}
