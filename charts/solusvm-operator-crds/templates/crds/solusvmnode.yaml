{{- if .Values.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: solusvmnodes.vm.solusvm.com
spec:
  group: vm.solusvm.com
  scope: Namespaced
  names:
    plural: solusvmnodes
    singular: solusvmnode
    kind: SolusVMNode
    shortNames:
      - svmn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - computeResourceId
                - locationId
                - controlRef
              properties:
                computeResourceId:
                  type: integer
                  description: "SolusVM compute resource id"
                locationId:
                  type: integer
                  description: "SolusVM location id attached to the compute resource"
                controlRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: "Name of the SolusVMControl CR"
                maintenanceMode:
                  type: boolean
                  default: false
                  description: "When enabled, reconciliation skips compute-resource probes"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Ready", "Error"]
                message:
                  type: string
                maintenanceMode:
                  type: boolean
                isLocked:
                  type: boolean
                  description: "Copied from compute resource is_locked"
                computeResourceStatus:
                  type: string
                  description: "Copied from compute resource status (active, commissioning, …)"
      subresources:
        status: {}
{{- end }}
