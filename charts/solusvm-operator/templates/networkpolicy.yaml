{{- if .Values.networkPolicy.enabled }}
{{- if .Values.operator.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "solusvm-operator.fullname" . }}-operator
  labels:
    {{- include "solusvm-operator.operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "solusvm-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  policyTypes:
    - Ingress
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- if .Values.prometheusExporter.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "solusvm-operator.fullname" . }}-exporter
  labels:
    {{- include "solusvm-operator.prometheusExporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "solusvm-operator.prometheusExporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - port: 9179
          protocol: TCP
    - from:
        - podSelector: {}
      ports:
        - port: 9179
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- end }}
