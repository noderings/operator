{{- if and .Values.vncGateway.enabled .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "solusvm-operator.fullname" . }}-vnc-gateway
  namespace: {{ .Values.vncGateway.namespace }}
  labels:
    {{- include "solusvm-operator.vncGateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "solusvm-operator.vncGateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: {{ .Values.vncGateway.port }}
          protocol: TCP
    {{- if .Values.vncGateway.networkPolicy.allowRemoteClients }}
    - ports:
        - port: {{ .Values.vncGateway.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.vncGateway.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - ports:
        - port: 443
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
