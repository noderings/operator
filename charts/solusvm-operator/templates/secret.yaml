{{- if .Values.operator.enabled }}
{{- range .Values.solusvm.instances }}
{{- if not .existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "solusvm-operator.credentialsSecretName" (dict "root" $ "instance" .) }}
  labels:
    {{- include "solusvm-operator.operator.labels" $ | nindent 4 }}
    solusvm.operator/instance-id: {{ .id | quote }}
type: Opaque
stringData:
  SOLUSVM_URL: {{ .url | quote }}
  SOLUSVM_TOKEN: {{ .token | default "" | quote }}
{{- end }}
{{- end }}
{{- end }}
