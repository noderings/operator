{{- if and .Values.operator.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "solusvm-operator.fullname" . }}-rb
  labels:
    {{- include "solusvm-operator.operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "solusvm-operator.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ default (include "solusvm-operator.serviceAccountName" .) .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
