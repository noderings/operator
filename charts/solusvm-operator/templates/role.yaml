{{- if and .Values.operator.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "solusvm-operator.fullname" . }}-role
  labels:
    {{- include "solusvm-operator.operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vm.solusvm.com"]
    resources: ["solusvmvms", "solusvmvms/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["vm.solusvm.com"]
    resources: ["solusvmcontrols", "solusvmcontrols/status", "solusvmnodes", "solusvmnodes/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["vm.solusvm.com"]
    resources: ["solusvmvncrequests", "solusvmvncrequests/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
{{- end }}
