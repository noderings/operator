{{- if and .Values.vncGateway.enabled .Values.vncGateway.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "solusvm-operator.fullname" . }}-vnc-gateway
  namespace: {{ .Values.vncGateway.namespace }}
  labels:
    {{- include "solusvm-operator.vncGateway.labels" . | nindent 4 }}
    {{- with .Values.vncGateway.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.vncGateway.namespace | quote }}
  selector:
    matchLabels:
      {{- include "solusvm-operator.vncGateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.vncGateway.serviceMonitor.path | default "/metrics" | quote }}
      interval: {{ .Values.vncGateway.serviceMonitor.interval | default "30s" | quote }}
      scrapeTimeout: {{ .Values.vncGateway.serviceMonitor.scrapeTimeout | default "10s" | quote }}
{{- end }}
